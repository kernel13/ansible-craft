---
# Main tasks for sample test role

- name: Install required packages
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop: "{{ packages }}"
  become: true
  tags:
    - install

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
  become: true

- name: Deploy application configuration
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ app_dir }}/config.yml"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0644'
  notify:
    - restart application
  become: true

- name: Ensure application service is running
  ansible.builtin.service:
    name: "{{ app_service }}"
    state: started
    enabled: true
  become: true
